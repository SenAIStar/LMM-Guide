[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vlm-product-sft"
version = "0.2.0"
description = "Auditable data, inference, evaluation, and routing utilities for product-image VLM SFT"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
inference = [
  "torch",
  "transformers>=4.57.0",
  "accelerate",
  "pillow",
  "qwen-vl-utils==0.0.14"
]

[tool.setuptools.packages.find]
where = ["src"]
