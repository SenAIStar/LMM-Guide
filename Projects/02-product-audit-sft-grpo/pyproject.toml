[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "product-audit-sft-grpo"
version = "0.1.0"
description = "Auditable multimodal product review contracts, rewards, evaluation, and service routing"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

