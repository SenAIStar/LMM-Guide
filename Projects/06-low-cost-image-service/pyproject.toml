[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "low-cost-image-service"
version = "0.1.0"
description = "Auditable scheduling and cost controls for a Diffusers image service"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

